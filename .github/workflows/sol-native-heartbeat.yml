name: Sol Native Heartbeat

on:
  push:
    paths:
      - .github/workflows/sol-native-heartbeat.yml
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: sol-native-heartbeat
  cancel-in-progress: true

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Trigger bounded Neon heartbeat
        env:
          SOL_HEARTBEAT_URL: https://ep-silent-butterfly-a6igtyfp.apirest.us-west-2.aws.neon.tech/neondb/rest/v1/rpc/sol_public_heartbeat_v1
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --fail-with-body --silent --show-error \
            -X POST "$SOL_HEARTBEAT_URL" \
            -H 'Content-Type: application/json' \
            -d '{}')"
          printf '%s\n' "$response"
          python3 - "$response" <<'PY'
          import json, sys
          payload = json.loads(sys.argv[1])
          status = payload.get('status')
          if status not in {'executed', 'rate_limited_ok'}:
              raise SystemExit(f'unexpected heartbeat status: {status!r}')
          if status == 'executed':
              if payload.get('health') != 'healthy':
                  raise SystemExit(f"unhealthy native runtime: {payload}")
              if payload.get('root_integrity') is not True or payload.get('identity_integrity') is not True:
                  raise SystemExit(f"integrity gate failed: {payload}")
              if payload.get('external_sensitive_effects') is not False:
                  raise SystemExit('unexpected sensitive external effect')
              if payload.get('paid_spend_initiated') is not False:
                  raise SystemExit('unexpected paid spend')
          print('SOL_NATIVE_HEARTBEAT_PASS')
          PY
