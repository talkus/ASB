[project]
name = "doctor-live"
version = "0.1.0"
description = "Contrôles DoctorLive, bibliothèque standard à l'exécution"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.13.0",
    "pre-commit>=4.0.0",
]

[tool.setuptools.packages.find]
include = ["core*", "doctor*"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
